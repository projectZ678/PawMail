<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mail.pawsocks.lat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #000;
  color: #fff;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  transition: background 0.2s ease;
}
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

::selection { background: #fff; color: #000; }

:focus-visible {
  outline: 1px solid rgba(255,255,255,0.3);
  outline-offset: 2px;
  border-radius: 2px;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes itemIn {
  from { opacity: 0; transform: translateX(-4px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}

.auth-screen, .landing-screen {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.auth-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  width: 300px;
  animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.auth-title, .landing-logo {
  font-size: 11px;
  letter-spacing: 6px;
  text-transform: uppercase;

  animation: fadeIn 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}

.username-wrap {

.username-wrap input {

  font-family: inherit;
  font-size: 13px;

  outline: none;
  text-align: right;
}

.username-suffix {
  font-size: 13px;

  padding: 8px 0 8px 1px;

}
.username-wrap:focus-within .username-suffix { color: rgba(255,255,255,0.5); }

.auth-field input {

.landing-btns {

.btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.45);
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 11px 28px;
  cursor: pointer;
  border-radius: 2px;
  transition:
    border-color 0.22s cubic-bezier(0.4, 0, 0.2, 1),

.btn:hover {

.btn-sm { padding: 7px 14px; font-size: 9px; letter-spacing: 2px; }

.btn-primary {

}

}

.btn-icon {

  border: none;
  color: rgba(255,255,255,0.3);
  cursor: pointer;
  padding: 5px 8px;
  font-family: inherit;
  font-size: 11px;
  border-radius: 2px;
  transition:

    background 0.2s cubic-bezier(0.4, 0, 0.2, 1),
    transform 0.16s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-icon:hover { color: #fff; background: rgba(255,255,255,0.05); }
.btn-icon:active { transform: scale(0.92); }

.auth-links {
  font-size: 10px;
  color: rgba(255,255,255,0.15);

  gap: 8px;

}
.auth-links a {

  transition: color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.auth-links a:hover { color: #fff; }
.auth-links .sep { color: rgba(255,255,255,0.12); }

#app {
  display: none;
  height: 100vh;
  flex-direction: column;
  animation: fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.topbar {
  height: 42px;
  border-bottom: 1px solid rgba(255,255,255,0.05);

.main { display: flex; flex: 1; overflow: hidden; }

.sidebar {

  flex-shrink: 0;

}

.compose-btn {
  margin: 0 12px 14px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.09);
  color: rgba(255,255,255,0.55);
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 11px;
  cursor: pointer;
  text-align: center;
  width: calc(100% - 24px);

    border-color 0.22s cubic-bezier(0.4, 0, 0.2, 1),

}
.compose-btn:hover {

}
.compose-btn:active { transform: scale(0.98); }

.nav-item, .folder-item {

  cursor: pointer;
  font-size: 10px;
  color: rgba(255,255,255,0.35);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-left: 2px solid transparent;
  transition:
    background 0.18s cubic-bezier(0.4, 0, 0.2, 1),
    color 0.18s cubic-bezier(0.4, 0, 0.2, 1),
    border-color 0.18s cubic-bezier(0.4, 0, 0.2, 1),
    padding-left 0.18s cubic-bezier(0.4, 0, 0.2, 1);
}
.nav-item:hover, .folder-item:hover {
  background: rgba(255,255,255,0.03);
  color: rgba(255,255,255,0.75);

}
.nav-item.active, .folder-item.active {

}
.nav-item { text-transform: lowercase; }
.folder-item {

}
.folder-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.folder-badge {
  font-size: 9px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  padding: 0 5px;
  border-radius: 8px;
  min-width: 16px;
  text-align: center;
  line-height: 14px;
  height: 14px;
}

.sidebar-divider {
  height: 1px;
  background: rgba(255,255,255,0.05);
  margin: 12px 12px 0;
  flex-shrink: 0;
}
.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding-bottom: 8px;
  scroll-behavior: smooth;
}
.section-label {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.18);
  padding: 12px 16px 6px;
}

.email-list-pane {
  width: 340px;
  border-right: 1px solid rgba(255,255,255,0.05);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  background: #000;
}
.pane-header {
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.pane-title {
  font-size: 11px;
  color: rgba(255,255,255,0.75);
  letter-spacing: 1px;
}

.search-bar {
  padding: 8px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  flex-shrink: 0;
}
.search-bar input {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  color: #fff;
  font-family: inherit;
  font-size: 11px;
  padding: 7px 10px;
  outline: none;
  border-radius: 2px;
  transition:
    border-color 0.22s cubic-bezier(0.4, 0, 0.2, 1),
    background 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}
.search-bar input:focus {
  border-color: rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.05);
}

.email-list { overflow-y: auto; flex: 1; scroll-behavior: smooth; }

.email-item {
  display: flex;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  cursor: pointer;
  transition:
    background 0.18s cubic-bezier(0.4, 0, 0.2, 1),
    padding-left 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.email-item:hover {

}
.email-item.active { background: rgba(255,255,255,0.055); }

.email-avatar {

  justify-content: center;
  font-size: 10px;
  font-weight: 500;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.04);
  transition:
    background 0.25s cubic-bezier(0.4, 0, 0.2, 1),
    color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
    border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
    transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.email-item:hover .email-avatar { transform: scale(1.05); }
.email-item.unread .email-avatar {
  background: rgba(255,255,255,0.11);
  color: #fff;
  border-color: rgba(255,255,255,0.18);
}

.email-main { flex: 1; min-width: 0; }
.email-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 2px;
}
.email-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #fff;
  flex-shrink: 0;
  animation: pulse 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
.email-from {
  flex: 1;
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.email-item.unread .email-from { color: #fff; font-weight: 500; }
.email-time {
  font-size: 9px;
  color: rgba(255,255,255,0.22);
  flex-shrink: 0;
}
.email-subject {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 1px;
  transition: color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.email-item.unread .email-subject { color: rgba(255,255,255,0.78); }
.email-preview {
  font-size: 10px;
  color: rgba(255,255,255,0.18);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.detail-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #000;
}
.detail-empty {
  text-align: center;
  margin-top: 40px;
  opacity: 0.2;
  animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.detail-view {
  animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  flex-direction: column;
  height: 100%;
}
.detail-header {
  padding: 18px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  animation: slideDown 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.detail-subject {
  font-size: 15px;
  margin-bottom: 10px;
  color: #fff;
  line-height: 1.35;
}
.detail-meta { font-size: 11px; color: rgba(255,255,255,0.42); }
.detail-date { font-size: 9px; opacity: 0.3; margin-top: 4px; }
.detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  white-space: pre-wrap;
  line-height: 1.7;
  color: rgba(255,255,255,0.75);
  word-break: break-word;
  animation: fadeIn 0.4s 0.05s cubic-bezier(0.4, 0, 0.2, 1) both;
  scroll-behavior: smooth;
}
.reply-area {
  border-top: 1px solid rgba(255,255,255,0.05);
  padding: 14px 24px;
  animation: slideUp 0.4s 0.1s cubic-bezier(0.4, 0, 0.2, 1) both;
}
.reply-area textarea {
  width: 100%;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.72);
  font-family: inherit;
  font-size: 12px;
  padding: 10px;
  min-height: 76px;
  outline: none;
  border-radius: 2px;
  resize: vertical;
  line-height: 1.6;
  transition:
    border-color 0.22s cubic-bezier(0.4, 0, 0.2, 1),
    background 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}
.reply-area textarea:focus {
  border-color: rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.035);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition:
    opacity 0.22s cubic-bezier(0.4, 0, 0.2, 1),
    visibility 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.modal-overlay.open { opacity: 1; visibility: visible; }

.modal {
  background: #0a0a0a;
  border: 1px solid rgba(255,255,255,0.08);
  width: 500px;
  max-width: 95vw;
  border-radius: 3px;
  transform: scale(0.96) translateY(6px);
  opacity: 0;
  transition:
    transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
    opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 24px 60px rgba(0,0,0,0.65);
}
.modal-overlay.open .modal {
  transform: scale(1) translateY(0);
  opacity: 1;
}

.modal-header {
  padding: 14px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header span {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.42);
}
.modal-field {
  padding: 10px 20px;
  display: flex;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  align-items: center;
  transition: background 0.18s cubic-bezier(0.4, 0, 0.2, 1);
}
.modal-field:focus-within { background: rgba(255,255,255,0.02); }
.modal-field label {
  width: 40px;
  opacity: 0.32;
  font-size: 10px;
  text-transform: uppercase;
}
.modal-field input, .modal-body textarea {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  outline: none;
  font-family: inherit;
  font-size: 12px;
}
.modal-body { padding: 0; }
.modal-body textarea {
  min-height: 150px;
  width: 100%;
  padding: 16px 20px;
  line-height: 1.6;
  resize: vertical;
}
.modal-footer {
  padding: 12px 20px;
  display: flex;
  gap: 8px;
  align-items: center;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.modal-status {
  margin-left: auto;
  font-size: 9px;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #0e0e0e;
  border: 1px solid rgba(255,255,255,0.09);
  padding: 12px 20px;
  font-size: 10px;
  letter-spacing: 0.5px;
  border-radius: 3px;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition:
    opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1),
    transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 200;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateY(0); }

.err {
  font-size: 10px;
  color: rgba(255,90,90,0.75);
  text-align: center;
  min-height: 12px;
}

.empty-state {
  text-align: center;
  padding: 40px 16px;
  opacity: 0.28;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

body{background:#050507;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px}
.paw-field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;opacity:.3}
.paw-field span{position:absolute;top:0;color:#b9a3ff;font-size:clamp(18px,2.2vw,34px);opacity:0;filter:grayscale(1);animation:pawFloat 22s linear infinite}
.paw-field span:nth-child(1){left:17%;animation-delay:-2s;animation-duration:21s}
.paw-field span:nth-child(2){left:34%;animation-delay:-4s;animation-duration:24s}
.paw-field span:nth-child(3){left:51%;animation-delay:-6s;animation-duration:27s}
.paw-field span:nth-child(4){left:68%;animation-delay:-8s;animation-duration:18s}
.paw-field span:nth-child(5){left:85%;animation-delay:-10s;animation-duration:21s}
.paw-field span:nth-child(6){left:6%;animation-delay:-12s;animation-duration:24s}
.paw-field span:nth-child(7){left:23%;animation-delay:-14s;animation-duration:27s}
.paw-field span:nth-child(8){left:40%;animation-delay:-16s;animation-duration:18s}
.paw-field span:nth-child(9){left:57%;animation-delay:-18s;animation-duration:21s}
.paw-field span:nth-child(10){left:74%;animation-delay:-20s;animation-duration:24s}
.paw-field span:nth-child(11){left:91%;animation-delay:-22s;animation-duration:27s}
.paw-field span:nth-child(12){left:12%;animation-delay:-24s;animation-duration:18s}
@keyframes pawFloat{0%{transform:translate3d(0,110vh,0) rotate(-24deg);opacity:0}12%{opacity:.22}85%{opacity:.14}100%{transform:translate3d(45px,-15vh,0) rotate(28deg);opacity:0}}
.auth-screen,.landing-screen{position:relative;z-index:1}
#app{position:relative;z-index:1;background:rgba(5,5,7,.96)}

.auth-box{width:min(360px,calc(100vw - 36px));padding:34px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:rgba(12,12,17,.82);box-shadow:0 24px 90px #0008;backdrop-filter:blur(18px)}
.auth-title,.landing-logo{letter-spacing:4px;opacity:.58}
.btn,.compose-btn{border-radius:9px;letter-spacing:1.5px}
.btn-primary{background:rgba(157,126,255,.13);border-color:rgba(171,145,255,.3);color:#e3d9ff}

.topbar{height:50px;background:#09090df5}
.sidebar{width:218px;background:#09090df5}
.nav-item,.folder-item{border-radius:0 8px 8px 0;margin-right:8px}
.compose-btn{border-radius:10px;background:rgba(157,126,255,.1);border-color:rgba(171,145,255,.24);color:#e4dcff}

.search-bar input,.reply-area textarea{border-radius:9px}

.email-avatar{width:34px;height:34px;border-radius:10px;background:rgba(157,126,255,.13);color:#d7caff}

  <div class="landing-logo">mail.pawsocks.lat</div>

const storage = (() => {
  try {
    const k = '__sb_test__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return window.localStorage;

      getItem: k => (k in mem ? mem[k] : null),

      removeItem: k => { delete mem[k]; }
    };
  }

let currentUser = null;
let currentSession = null;
let allEmails = [];
let currentFolder = 'inbox';
let refreshTimer = null;
let myEmail = '';
let selectedId = null;

const $ = id => document.getElementById(id);

function showToast(msg) {
  const toast = $('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function showAuth(screen) {
  $('landing-screen').style.display = screen === 'landing' ? 'flex' : 'none';
  $('login-screen').style.display = screen === 'login' ? 'flex' : 'none';
  $('register-screen').style.display = screen === 'register' ? 'flex' : 'none';
  if (screen === 'login') $('login-username').focus();
  if (screen === 'register') $('reg-username').focus();
}

async function sbFetch(path, options = {}) {
  if (!currentSession?.access_token) throw new Error('Please sign in again.');
  const headers = {
    apikey: SUPABASE_KEY,
    'Content-Type': 'application/json',
    Authorization: `Bearer ${currentSession.access_token}`,
    ...(options.headers || {})
  };
  const res = await fetch(`${SUPABASE_URL}${path}`, { ...options, headers });
  if (!res.ok) throw new Error(await res.text() || `Request failed (${res.status})`);
  if (res.status === 204) return null;
  return res.json();
}

async function authRequest(path, body) {
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error_description || 'request failed');
  return data;
}

function saveSession(session, email) {
  currentSession = session;
  currentUser = session.user;
  myEmail = email;
  storage.setItem('session', JSON.stringify({ session, email }));
}

function clearSession() {
  currentSession = null;
  currentUser = null;
  allEmails = [];
  myEmail = '';
  selectedId = null;
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = null;
  storage.removeItem('session');
}

async function enterApp() {
  $('app').style.display = 'flex';
  $('landing-screen').style.display = 'none';
  $('login-screen').style.display = 'none';
  $('register-screen').style.display = 'none';
  $('topbar-addr').textContent = myEmail;
  $('detail-view').style.display = 'none';
  $('detail-empty').style.display = 'block';
  currentFolder = 'inbox';
  await loadEmails();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadEmails, 15000);
}

async function doLogin() {
  const username = $('login-username').value.trim().toLowerCase();
  const password = $('login-password').value;
  const errEl = $('login-err');
  errEl.textContent = '';
  if (!username) return (errEl.textContent = 'enter username');
  if (!password) return (errEl.textContent = 'enter password');
  try {
    const email = `${username}@pawsocks.lat`;
    const session = await authRequest('/auth/v1/token?grant_type=password', { email, password });
    saveSession(session, email);
    await enterApp();
  } catch (err) {
    errEl.textContent = err.message;
  }
}

async function doRegister() {
  const username = $('reg-username').value.trim().toLowerCase();
  const password = $('reg-password').value;
  const password2 = $('reg-password2').value;
  const errEl = $('reg-err');
  errEl.textContent = '';
  if (!username || username.length < 2) return (errEl.textContent = 'username too short');
  if (password.length < 6) return (errEl.textContent = 'password min 6 chars');
  if (password !== password2) return (errEl.textContent = 'passwords do not match');
  try {
    const email = `${username}@pawsocks.lat`;
    const data = await authRequest('/auth/v1/signup', { email, password, data: { username } });
    if (data.access_token) {
      saveSession(data, email);
      await enterApp();
    } else {
      errEl.textContent = 'account created, please sign in';
      setTimeout(() => showAuth('login'), 2000);
    }
  } catch (err) {
    errEl.textContent = err.message;
  }
}

async function loadEmails() {
  if (!currentSession) return;
  try {
    let query = `/rest/v1/emails?select=*&order=received_at.desc.nullslast`;
    if (currentUser?.id) query += `&user_id=eq.${currentUser.id}`;
    const data = await sbFetch(query, {});
    allEmails = Array.isArray(data) ? data : [];
    renderFolders();
    renderEmailList();
    updateUnreadCount();
  } catch (err) {
    $('email-list').innerHTML = `<div class="empty-state">error: ${escapeHtml(err.message)}</div>`;
  }
}

function getProvider(fromAddress, fromName) {
  const addr = (fromAddress || '').toLowerCase().trim();
  const domain = addr.includes('@') ? addr.split('@').pop() : '';
  if (!domain) return fromName || 'Other';
  if (PROVIDERS[domain]) return PROVIDERS[domain];
  const parts = domain.split('.');
  if (parts.length >= 2) {
    const parent = parts.slice(-2).join('.');
    if (PROVIDERS[parent]) return PROVIDERS[parent];
    const sld = parts[parts.length - 2];
    if (sld && sld.length >= 2 && !/^\d+$/.test(sld)) {
      return sld.charAt(0).toUpperCase() + sld.slice(1);
    }
  }
  return fromName || 'Other';
}

function buildFolderMap() {
  const map = new Map();
  for (const email of allEmails) {
    if (email.folder === 'sent') continue;
    if (email.is_deleted) continue;
    const provider = getProvider(email.from_address, email.from_name);
    if (!map.has(provider)) map.set(provider, { name: provider, total: 0, unread: 0 });
    const f = map.get(provider);
    f.total++;
    if (!email.is_read) f.unread++;
  }
  return [...map.values()].sort((a, b) => b.unread - a.unread || b.total - a.total || a.name.localeCompare(b.name));
}

function renderFolders() {
  const folders = buildFolderMap();
  const list = $('folder-list');
  if (!folders.length) {
    list.innerHTML = '<div class="empty-state" style="padding:20px 16px;font-size:9px;">no folders yet</div>';
    return;
  }
  list.innerHTML = folders.map(f => `
    <div class="folder-item ${currentFolder === f.name ? 'active' : ''}" data-folder="${escapeHtml(f.name)}" onclick="setFolder(this.dataset.folder, this)">
      <span class="folder-name">${escapeHtml(f.name)}</span>
      ${f.unread > 0 ? `<span class="folder-badge">${f.unread}</span>` : ''}
    </div>
  `).join('');
}

function getFilteredEmails() {
  let list = allEmails;
  if (currentFolder === 'sent') {
    list = list.filter(e => e.folder === 'sent');
  } else if (currentFolder === 'inbox') {
    list = list.filter(e => e.folder !== 'sent' && !e.is_deleted);
  } else {
    list = list.filter(e => e.folder !== 'sent' && !e.is_deleted && getProvider(e.from_address, e.from_name) === currentFolder);
  }
  const search = ($('search-input')?.value || '').toLowerCase().trim();
  if (search) {
    list = list.filter(e =>
      (e.subject || '').toLowerCase().includes(search) ||
      (e.from_address || '').toLowerCase().includes(search) ||
      (e.body_text || '').toLowerCase().includes(search)
    );
  }
  return list;
}

function renderEmailList() {
  const container = $('email-list');
  const filtered = getFilteredEmails();
  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state">${$('search-input')?.value ? 'no results' : 'no messages'}</div>`;
    return;
  }
  container.innerHTML = filtered.map((email, i) => {
    const isActive = email.id === selectedId;
    const isSent = email.folder === 'sent';
    const sender = isSent ? `to: ${email.to_address || '—'}` : (email.from_name || email.from_address || 'unknown');
    const avatar = (sender.replace(/^to:\s*/, '').match(/[a-z0-9]/i) || ['?'])[0].toUpperCase();
    const preview = (email.body_text || stripHtml(email.body_html) || '').slice(0, 90);
    const delay = Math.min(i * 18, 180);
    return `
      <div class="email-item ${email.is_read ? '' : 'unread'} ${isActive ? 'active' : ''}"
           data-id="${email.id}"
           style="animation-delay:${delay}ms"
           onclick="viewEmail('${email.id}')">
        <div class="email-avatar">${escapeHtml(avatar)}</div>
        <div class="email-main">
          <div class="email-top">
            ${email.is_read ? '' : '<span class="email-dot"></span>'}
            <span class="email-from">${escapeHtml(sender)}</span>
            <span class="email-time">${formatDate(email.received_at)}</span>
          </div>
          <div class="email-subject">${escapeHtml(email.subject || '(no subject)')}</div>
          <div class="email-preview">${escapeHtml(preview)}</div>
        </div>
      </div>
    `;
  }).join('');
}

async function viewEmail(id) {
  const email = allEmails.find(e => e.id === id);
  if (!email) return;
  selectedId = id;
  $('detail-empty').style.display = 'none';
  $('detail-view').style.display = 'flex';
  $('detail-subject').textContent = email.subject || '(no subject)';
  $('detail-from').textContent = email.from_address || email.from_name;
  $('detail-to').textContent = email.to_address;
  $('detail-date').textContent = formatDateTime(email.received_at);
  $('detail-body').innerHTML = `<div style="white-space:pre-wrap;">${escapeHtml(email.body_text || stripHtml(email.body_html) || '(no content)')}</div>`;
  $('reply-text').placeholder = `Reply to ${email.from_address || ''}`;
  document.querySelectorAll('.email-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  if (!email.is_read) {
    email.is_read = true;
    renderEmailList();
    renderFolders();
    updateUnreadCount();
    try {
      await sbFetch(`/rest/v1/emails?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ is_read: true }) });
    } catch {}
  }
}

function setFolder(folder, el) {
  currentFolder = folder;
  selectedId = null;
  document.querySelectorAll('[data-folder]').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  $('pane-title').textContent = folder;
  $('detail-view').style.display = 'none';
  $('detail-empty').style.display = 'block';
  renderEmailList();
}

function updateUnreadCount() {
  const count = allEmails.filter(e => e.folder !== 'sent' && !e.is_read && !e.is_deleted).length;
  $('unread-count').textContent = count > 0 ? count : '';
}

function refreshEmails() {
  $('email-list').innerHTML = '<div class="empty-state">loading...</div>';
  loadEmails();
}

function doLogout() {
  clearSession();
  $('app').style.display = 'none';
  showAuth('landing');
}

function openCompose() {
  $('compose-modal').classList.add('open');
  $('compose-to').value = '';
  $('compose-subject').value = '';
  $('compose-body').value = '';
  $('compose-status').textContent = '';
  setTimeout(() => $('compose-to').focus(), 120);
}

function closeCompose() {
  $('compose-modal').classList.remove('open');
}

async function sendViaEdge(to, subject, text) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/mail-send`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${currentSession.access_token}`
    },
    body: JSON.stringify({ to, subject: subject || '(no subject)', text })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Send failed');
  return data;
}


async function sendCompose() {
  const to = $('compose-to').value.trim();
  const subject = $('compose-subject').value.trim();
  const body = $('compose-body').value.trim();
  const status = $('compose-status');
  if (!to || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) return (status.textContent = 'enter a valid recipient');
  if (!body) return (status.textContent = 'enter message');
  status.textContent = 'sending...';
  try {
    await sendViaEdge(to, subject, body);
    status.textContent = 'sent!';
    showToast('message sent');
    setTimeout(closeCompose, 900);
    loadEmails();
  } catch (err) {
    status.textContent = 'failed';
    showToast('send failed: ' + err.message);
  }
}

async function sendReply() {
  const body = $('reply-text').value.trim();
  if (!body || !selectedId) return;
  const email = allEmails.find(e => e.id === selectedId);
  if (!email) return;
  const replyTo = email.from_address || email.from_name;
  if (!replyTo) return showToast('cannot determine recipient');
  const subject = `Re: ${email.subject || '(no subject)'}`;
  try {
    await sendViaEdge(replyTo, subject, body);
    $('reply-text').value = '';
    showToast('reply sent');
    loadEmails();
  } catch (err) {
    showToast('reply failed: ' + err.message);
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function stripHtml(html) {
  if (!html) return '';
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.textContent || d.innerText || '';
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm';
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  if (now - d < 7 * 86400 * 1000) {
    return d.toLocaleDateString([], { weekday: 'short' });
  }
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function formatDateTime(ts) {
  return ts ? new Date(ts).toLocaleString() : '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('compose-modal').classList.contains('open')) {
    closeCompose();
  }
});

async function restoreSession() {
  const saved = storage.getItem('session');
  if (!saved) return showAuth('landing');
  try {
    const { session, email } = JSON.parse(saved);
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}` }
    });
    if (!res.ok) throw new Error('expired');
    currentSession = session;
    currentUser = await res.json();
    myEmail = email;
    await enterApp();
  } catch {
    clearSession();
    showAuth('landing');
  }
}

restoreSession();
